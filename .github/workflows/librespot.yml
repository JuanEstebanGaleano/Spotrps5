# SPDX-License-Identifier: GPL-3.0-or-later
# Milestone 2: builds librespot for x86-64 Linux (what the loader runs) and reports what the loader is missing for it.
name: librespot

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  LIBRESPOT_TAG: v0.8.0

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Get librespot (pinned tag)
        run: git clone --depth 1 --branch "$LIBRESPOT_TAG" https://github.com/librespot-org/librespot.git librespot

      - name: Build (rustls, compiled-in certificates, mDNS, pipe/subprocess audio only)
        working-directory: librespot
        run: cargo build --release --no-default-features --features "rustls-tls-webpki-roots with-libmdns"

      - name: Analyze against the loader
        run: |
          set -euo pipefail
          ls -la librespot/target/release/librespot
          python3 tools/analyze_binary.py librespot/target/release/librespot --markdown "$GITHUB_STEP_SUMMARY" | tee analysis.txt

      # The report and the program are also committed (as one forced commit) to the ci-reports branch, so they can be read
      # and run without downloading artifacts.
      - name: Publish the report and the program to the ci-reports branch
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          cp analysis.txt "$RUNNER_TEMP/out/librespot-analysis.md"
          cp librespot/target/release/librespot "$RUNNER_TEMP/out/librespot"
          strip --strip-debug "$RUNNER_TEMP/out/librespot"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan reports-tmp
          git rm -rf --quiet . 2>/dev/null || true
          cp "$RUNNER_TEMP/out/"* .
          git add librespot-analysis.md librespot
          git commit -q -m "librespot build and analysis for ${GITHUB_SHA::12}"
          git push --force origin reports-tmp:ci-reports

      - uses: actions/upload-artifact@v4
        with:
          name: librespot-x86_64-linux
          path: |
            librespot/target/release/librespot
            analysis.txt
